name: build

permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pywebview pyobjc-framework-Quartz pyinstaller
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --name TIM --windowed --noconfirm --clean --icon icon.icns --add-data "ui:ui" --hidden-import webview.platforms.cocoa --hidden-import objc --hidden-import Quartz --osx-bundle-identifier com.tim.robot main.py
      - run: hdiutil create -volname "Т.И.М." -srcfolder dist/TIM.app -ov -format UDZO TIM-mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: TIM-mac.dmg

  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pywebview pythonnet pyinstaller pystray pillow
      - name: Линтер JS
        run: npx --yes eslint@8 --no-eslintrc --env browser,es2021 --parser-options=ecmaVersion:2021 --rule "{\"no-undef\":\"warn\",\"no-unused-vars\":\"warn\"}" ui/app.js ui/js/ || true
      - name: Проверка синтаксиса JS
        run: node --check ui/app.js && node --check ui/js/audio.js && node --check ui/js/faces.js && node --check ui/js/stats.js && node --check ui/js/tetris.js && node --check ui/js/menu.js
      - shell: cmd
        run: python -m PyInstaller --name TIM --windowed --noconfirm --clean --icon icon.ico --add-data "ui;ui" --collect-all pythonnet --hidden-import clr --hidden-import clr_loader --hidden-import webview.platforms.winforms --hidden-import webview.platforms.edgechromium --hidden-import pystray._win32 --hidden-import PIL.Image main.py
      - run: choco install innosetup -y --no-progress
      - shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/TIM-setup.exe

  release:
    needs: [mac, win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Т.И.М. ${{ github.ref_name }}
          body: |
            macOS: TIM-mac.dmg — откройте образ и перетащите приложение в Applications.
            Windows: TIM-setup.exe — обычный установщик с ярлыком и удалением.
            Приложение без подписи: на macOS первый запуск через правый клик → Открыть.
          files: |
            out/mac/TIM-mac.dmg
            out/windows/TIM-setup.exe
