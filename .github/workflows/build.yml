name: build

permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pywebview pyobjc-framework-Quartz pyinstaller
      - run: python -m PyInstaller --name TIM --windowed --noconfirm --clean --add-data "ui:ui" --hidden-import webview.platforms.cocoa --hidden-import objc --hidden-import Quartz --osx-bundle-identifier com.tim.robot main.py
      - run: ditto -c -k --sequesterRsrc --keepParent "dist/TIM.app" "TIM-mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: TIM-mac.zip

  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pywebview pyinstaller
      - shell: cmd
        run: python -m PyInstaller --name TIM --windowed --noconfirm --clean --add-data "ui;ui" --hidden-import webview.platforms.winforms --hidden-import webview.platforms.edgechromium main.py
      - run: Compress-Archive -Path "dist\TIM" -DestinationPath "TIM-win.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: TIM-win.zip

  release:
    needs: [mac, win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Т.И.М. ${{ github.ref_name }}
          body: |
            CRT-компаньон: трей, ⌥Space, меню, тетрис, кормление, танец, звуки флоппи и модема.
            macOS: распакуйте TIM-mac.zip (приложение без подписи — правый клик → Открыть).
            Windows: распакуйте TIM-win.zip и запустите TIM/TIM.exe.
          files: |
            out/mac/TIM-mac.zip
            out/windows/TIM-win.zip
