<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Т.И.М. — терминал</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #CFC8B7;
    font-family: ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }

  /* ---- терминал ---- */
  .case { position: absolute; inset: 6px; border-radius: 12px; padding: 6px;
    background: linear-gradient(160deg, #F0EADB, #B0A691);
    border: 3px solid #6E675A; box-shadow: 0 8px 20px rgba(30,20,10,.25);
    display: flex; flex-direction: column; }
  .screen { flex: 1; background: #071108; border-radius: 5px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: inset 0 0 20px rgba(60,255,134,.18); }
  .bar { font-size: 9px; color: #5FBE86; padding: 3px 6px;
    border-bottom: 1px solid #143b22; letter-spacing: .05em; }
  .log { flex: 1; overflow-y: auto; padding: 5px 7px; font-size: 11px; line-height: 1.35; }
  .log .q { color: #CFFFE2; }
  .log .a { color: #9BFFC4; }
  .log .s { color: #4E8A63; }
  .log div { margin-bottom: 3px; white-space: pre-wrap; }
  .entry { display: flex; align-items: center; border-top: 1px solid #143b22; }
  .entry span { color: #66FF9E; padding: 0 5px; }
  .entry input { flex: 1; height: 28px; border: 0; outline: none; background: transparent;
    color: #CFFFE2; font: 11px ui-monospace, Menlo, monospace; }
  .entry input::placeholder { color: #3F6E52; }
  .keys { display: flex; gap: 5px; justify-content: center; padding: 5px 0 1px; }
  .keys button { width: 30px; height: 18px; border-radius: 4px; cursor: pointer;
    background: #E8E1D0; border: 1.2px solid #6E675A; color: #4E4838; font-size: 10px; }
  .keys button:hover { background: #F5EFE2; border-color: #2E8B57; }

  /* ---- дискета ---- */
  .mini { position: absolute; inset: 0; display: none; }
  .mini.on { display: block; }
  body.mini .case { display: none; }
  .floppy { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 92px; height: 92px; border-radius: 10px; cursor: pointer;
    background: linear-gradient(160deg, #F0EADB, #B0A691);
    border: 3px solid #6E675A; box-shadow: 0 8px 18px rgba(30,20,10,.25); }
  .floppy i { position: absolute; left: 20px; top: 14px; width: 52px; height: 34px;
    background: #2E2A22; border-radius: 3px; box-shadow: inset 0 0 0 4px #4A4438; }
  .floppy u { position: absolute; left: 26px; top: 52px; width: 40px; height: 4px;
    background: #4A4438; border-radius: 2px; }
  .floppy b { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center;
    font-size: 10px; color: #4E4838; font-weight: 400; }
  .floppy s { position: absolute; right: 10px; bottom: 10px; width: 14px; height: 14px;
    border-radius: 50%; background: #4BFF8D; }
</style>
</head>
<body>
  <div class="case">
    <div class="screen">
      <div class="bar" id="bar">Т.И.М. · ур.1 · ⚡100 ♥100 ☾100</div>
      <div class="log" id="log"></div>
      <div class="entry">
        <span>&gt;</span>
        <input id="q" placeholder="спросить…" autocomplete="off">
      </div>
    </div>
    <div class="keys">
      <button data-k="power" title="Выход">⏻</button>
      <button data-k="menu" title="Меню">≡</button>
      <button data-k="sleep" title="Сон">☾</button>
      <button data-k="sound" title="Звук">🔊</button>
      <button data-k="mini" title="Свернуть в дискету">⤡</button>
    </div>
  </div>

  <div class="mini"><div class="floppy" id="floppy">
    <i></i><u></u><b>Т.И.М.</b><s></s>
  </div></div>

<script>
(function () {
  var log = document.getElementById("log");
  var q = document.getElementById("q");
  var stats = { batt: 100, hp: 100, sleep: 100, lvl: 1 };

  function paintBar() {
    document.getElementById("bar").textContent =
      "Т.И.М. · ур." + stats.lvl + " · ⚡" + Math.round(stats.batt) +
      " ♥" + Math.round(stats.hp) + " ☾" + Math.round(stats.sleep);
  }
  function say(cls, text) {
    var d = document.createElement("div");
    d.className = cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }
  var replies = {
    "погода": "+3°, облачно, ветер 4 м/с. Оденься теплее.",
    "время": "Сейчас " + new Date().toLocaleTimeString("ru-RU").slice(0, 5),
    "шутка": "Программист ставит на ночь два стакана: один с водой, второй пустой.",
    "помощь": "Команды: погода, время, шутка, состояние, тетрис.",
    "состояние": "Батарея 100, здоровье 100, сон 100. Всё в норме."
  };

  function ask(text) {
    if (!text) return;
    say("q", "— " + text);
    var key = text.toLowerCase().trim();
    var answer = replies[key];
    if (!answer) {
      for (var k in replies) if (key.indexOf(k) >= 0) { answer = replies[k]; break; }
    }
    say("a", answer || "Пока не знаю такой команды. Попробуйте: погода, время, шутка, состояние.");
    stats.batt = Math.max(0, stats.batt - 0.5);
    paintBar();
  }

  var hist = [], hp = -1;
  q.addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp" && hist.length) {
      hp = Math.max(0, (hp < 0 ? hist.length : hp) - 1);
      q.value = hist[hp]; e.preventDefault(); return;
    }
    if (e.key === "ArrowDown" && hist.length) {
      hp = Math.min(hist.length, hp + 1);
      q.value = hp >= hist.length ? "" : hist[hp];
      e.preventDefault(); return;
    }
    if (e.key !== "Enter") return;
    var text = q.value.trim();
    if (text) { hist.push(text); hp = -1; }
    ask(text);
    q.value = "";
  });

  document.querySelectorAll(".keys button").forEach(function (b) {
    b.addEventListener("click", function () {
      var k = b.dataset.k;
      if (k === "mini") { document.body.classList.add("mini"); return; }
      if (k === "sleep") { say("s", "— экран погашен"); return; }
      if (k === "sound") { say("s", "— звук переключён"); return; }
      if (k === "menu") { say("s", "— меню: покормить · танец · игры · сервис"); return; }
      if (k === "power") { say("s", "— выход (в приложении закроет окно)"); }
    });
  });

  document.getElementById("floppy").addEventListener("click", function () {
    document.body.classList.remove("mini");
  });

  say("s", "Т.И.М. на связи. Напишите «помощь» или нажмите подсказку ниже.");
  ["погода", "время", "шутка", "состояние"].forEach(function (word) {
    var chip = document.createElement("span");
    chip.textContent = word;
    chip.style.cssText = "display:inline-block;margin:6px 4px 0 0;padding:1px 6px;border:1px solid #2A5A3A;border-radius:9px;color:#66FF9E;cursor:pointer;font-size:10px";
    chip.onclick = function () { q.value = word; q.focus(); };
    log.appendChild(chip);
  });
  paintBar();
  q.focus();
})();
</script>
</body>
</html>
