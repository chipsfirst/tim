<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Т.И.М. — планшет</title>
<style>
 *{box-sizing:border-box}
 html,body{margin:0;height:100%;background:#CFC8B7;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
 .device{position:absolute;inset:8px;border-radius:22px;padding:10px;
  background:linear-gradient(160deg,#F5F0E3,#BCB2A0);border:3px solid #6E675A;
  box-shadow:0 10px 26px rgba(30,20,10,.28);display:flex;flex-direction:column;gap:8px}
 .screen{flex:1;border-radius:14px;background:#071108;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:inset 0 0 22px rgba(60,255,134,.18),0 2px 0 rgba(255,255,255,.35)}
 .bar{font-size:9px;color:#5FBE86;padding:4px 8px;border-bottom:1px solid #143b22;letter-spacing:.05em}
 .log{flex:1;overflow-y:auto;padding:6px 8px;font-size:11px;line-height:1.35}
 .log .q{color:#CFFFE2}.log .a{color:#9BFFC4}.log .s{color:#4E8A63}
 .log div{margin-bottom:3px;white-space:pre-wrap}
 .entry{display:flex;align-items:center;border-top:1px solid #143b22;background:#0A1A0F}
 .entry span{color:#66FF9E;padding:0 7px}
 .entry input{flex:1;height:30px;border:0;outline:none;background:transparent;color:#CFFFE2;font:11px ui-monospace,monospace}
 .entry input::placeholder{color:#3F6E52}
 .keys{display:flex;gap:6px;justify-content:center}
 .keys button{width:44px;height:24px;border-radius:7px;cursor:pointer;font-size:12px;
  background:linear-gradient(180deg,#F1EBDC,#CFC7B4);border:1.4px solid #6E675A;color:#4E4838}
 .keys button:hover{background:#F7F2E6;border-color:#2E8B57}
</style></head><body>
 <div class="device">
  <div class="screen">
   <div class="bar" id="bar">Т.И.М. · ур.1 · ⚡100 ♥100 ☾100</div>
   <div class="log" id="log"></div>
   <div class="entry"><span>&gt;</span><input id="q" placeholder="спросить…" autocomplete="off"></div>
  </div>
  <div class="keys">
   <button data-k="power">⏻</button><button data-k="menu">≡</button>
   <button data-k="sleep">☾</button><button data-k="sound">🔊</button>
   <button data-k="mini">⤡</button>
  </div>
 </div>
<script>
(function () {
  var log = document.getElementById("log");
  var q = document.getElementById("q");
  var stats = { batt: 100, hp: 100, sleep: 100, lvl: 1 };

  function paintBar() {
    document.getElementById("bar").textContent =
      "Т.И.М. · ур." + stats.lvl + " · ⚡" + Math.round(stats.batt) +
      " ♥" + Math.round(stats.hp) + " ☾" + Math.round(stats.sleep);
  }
  function say(cls, text) {
    var d = document.createElement("div");
    d.className = cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }
  var replies = {
    "погода": "+3°, облачно, ветер 4 м/с. Оденься теплее.",
    "время": "Сейчас " + new Date().toLocaleTimeString("ru-RU").slice(0, 5),
    "шутка": "Программист ставит на ночь два стакана: один с водой, второй пустой.",
    "помощь": "Команды: погода, время, шутка, состояние, тетрис.",
    "состояние": "Батарея 100, здоровье 100, сон 100. Всё в норме."
  };

  function ask(text) {
    if (!text) return;
    say("q", "— " + text);
    var key = text.toLowerCase().trim();
    var answer = replies[key];
    if (!answer) {
      for (var k in replies) if (key.indexOf(k) >= 0) { answer = replies[k]; break; }
    }
    say("a", answer || "Пока не знаю такой команды. Попробуйте: погода, время, шутка, состояние.");
    stats.batt = Math.max(0, stats.batt - 0.5);
    paintBar();
  }

  var hist = [], hp = -1;
  q.addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp" && hist.length) {
      hp = Math.max(0, (hp < 0 ? hist.length : hp) - 1);
      q.value = hist[hp]; e.preventDefault(); return;
    }
    if (e.key === "ArrowDown" && hist.length) {
      hp = Math.min(hist.length, hp + 1);
      q.value = hp >= hist.length ? "" : hist[hp];
      e.preventDefault(); return;
    }
    if (e.key !== "Enter") return;
    var text = q.value.trim();
    if (text) { hist.push(text); hp = -1; }
    ask(text);
    q.value = "";
  });

  document.querySelectorAll(".keys button").forEach(function (b) {
    b.addEventListener("click", function () {
      var k = b.dataset.k;
      if (k === "mini") { document.body.classList.add("mini"); return; }
      if (k === "sleep") { say("s", "— экран погашен"); return; }
      if (k === "sound") { say("s", "— звук переключён"); return; }
      if (k === "menu") { say("s", "— меню: покормить · танец · игры · сервис"); return; }
      if (k === "power") { say("s", "— выход (в приложении закроет окно)"); }
    });
  });

  var fl = document.getElementById("floppy");
  if (fl) fl.addEventListener("click", function () { document.body.classList.remove("mini"); });

  say("s", "Т.И.М. на связи. Напишите «помощь» или нажмите подсказку ниже.");
  ["погода", "время", "шутка", "состояние"].forEach(function (word) {
    var chip = document.createElement("span");
    chip.textContent = word;
    chip.style.cssText = "display:inline-block;margin:6px 4px 0 0;padding:1px 6px;border:1px solid #2A5A3A;border-radius:9px;color:#66FF9E;cursor:pointer;font-size:10px";
    chip.onclick = function () { q.value = word; q.focus(); };
    log.appendChild(chip);
  });
  paintBar();
  q.focus();
})();
</script>
</body></html>
