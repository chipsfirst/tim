<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Т.И.М.</title>
<link rel="stylesheet" href="style.css">
<style>

 *{box-sizing:border-box}
 html,body{margin:0;height:100%;background:#CFC8B7;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
 .device{position:absolute;inset:8px;border-radius:22px;padding:10px;
  background:linear-gradient(160deg,#F5F0E3,#BCB2A0);border:3px solid #6E675A;
  box-shadow:0 10px 26px rgba(30,20,10,.28);display:flex;flex-direction:column;gap:8px}
 .screen{flex:1;border-radius:14px;background:#071108;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:inset 0 0 22px rgba(60,255,134,.18),0 2px 0 rgba(255,255,255,.35)}
 .bar{font-size:9px;color:#5FBE86;padding:4px 8px;border-bottom:1px solid #143b22;letter-spacing:.05em}
 .log{flex:1;overflow-y:auto;padding:6px 8px;font-size:11px;line-height:1.35}
 .log .q{color:#CFFFE2}.log .a{color:#9BFFC4}.log .s{color:#4E8A63}
 .log div{margin-bottom:3px;white-space:pre-wrap}
 .entry{display:flex;align-items:center;border-top:1px solid #143b22;background:#0A1A0F}
 .entry span{color:#66FF9E;padding:0 7px}
 .entry input{flex:1;height:30px;border:0;outline:none;background:transparent;color:#CFFFE2;font:11px ui-monospace,monospace}
 .entry input::placeholder{color:#3F6E52}
 .keys{position:relative;z-index:20;display:flex;gap:4px;justify-content:center;flex-wrap:nowrap}
.keys button,#tx{flex:0 0 34px!important;width:34px!important;min-width:34px!important;height:20px!important;
  padding:0!important;font-size:10px!important;margin:0!important}
 .keys button{width:36px;height:22px;border-radius:6px;cursor:pointer;font-size:12px;
  background:linear-gradient(180deg,#F1EBDC,#CFC7B4);border:1.4px solid #6E675A;color:#4E4838}
 .keys button:hover{background:#F7F2E6;border-color:#2E8B57}

#bubble{display:block!important;position:static!important;opacity:1;transform:none;width:auto;max-width:none;left:auto;flex:1;min-height:0;overflow-y:auto;opacity:1;position:static;transform:none;width:auto;max-height:none;
  background:transparent;box-shadow:none;color:#9BFFC4;font-size:11px;padding:6px 8px}
#bubble-text{white-space:pre-wrap}
#bubble::after{display:none}
.face{padding:4px 8px 0}
#tx{position:static!important;width:30px!important;height:18px!important;border-radius:4px;
  display:block;border:1.2px solid #B4442E!important;color:#B4442E!important;font-size:10px;cursor:pointer}
#tw.on ~ #tx{display:block}
#tw.on ~ #tx{display:block}
#mouth > #face-smile{display:block}
body[class*="face-"] #mouth > #face-smile{display:none}
body.face-open #mouth > #face-open,
body.face-wide #mouth > #face-wide,
body.face-flat #mouth > #face-flat,
body.face-o #mouth > #face-o,
body.face-tongue #mouth > #face-tongue{display:block}
.bar{display:flex;align-items:center;gap:6px}
.led{width:7px;height:7px;border-radius:50%;background:#4BFF8D;box-shadow:0 0 8px #4BFF8D;animation:ledPulse 2.2s ease-in-out infinite}
@keyframes ledPulse{0%,100%{opacity:1}50%{opacity:.35}}
.face svg{display:block;height:56px;filter:drop-shadow(0 0 6px rgba(90,255,150,.45))}
#tw{display:none;position:absolute!important;left:10px!important;right:10px!important;top:110px!important;bottom:96px!important;width:calc(100% - 20px)!important;height:calc(100% - 206px)!important;z-index:5}
#menu{position:absolute!important;left:10px!important;right:10px!important;top:auto!important;bottom:100px!important;width:auto!important;height:auto!important;max-height:150px!important;z-index:15}
#panel.show,#bubble.show{transform:none!important;left:auto!important;margin-left:0!important}
.device{inset:0!important;border-radius:10px!important;padding:8px!important}
#floppy-mini{display:none}
body.mini #floppy-mini{display:flex}
#panel{display:flex!important;position:static!important;transform:none;width:auto;max-width:none;left:auto;flex:0 0 auto;background:transparent;border-top:1px solid #143b22;box-shadow:none;padding:0}
#q{flex:1;height:30px;border:0;outline:none;background:transparent;color:#CFFFE2;font:11px ui-monospace,monospace}
#panel button{width:26px;height:26px;background:transparent;border:0;color:#66FF9E;font-size:12px}
#mbtn,#sleepbtn,#sound,#power,#widebtn{background:linear-gradient(180deg,#F1EBDC,#CFC7B4);
  border:1.4px solid #6E675A;border-radius:7px;color:#4E4838}
</style></head>
<body>
 <div class="device">
  <div class="screen">
   <div class="bar" id="bar"><span id="led" class="led"></span><span id="bar-text"></span></div>
   <div class="face">
     <svg viewBox="0 0 220 56" width="100%" height="46" shape-rendering="crispEdges">
       <g id="eyes">
         <g class="eye"><rect x="52" y="10" width="30" height="22" fill="#0E3A1B"/>
           <rect class="pupil" x="61" y="16" width="11" height="10" fill="#66FF9E"/></g>
         <g class="eye"><rect x="138" y="10" width="30" height="22" fill="#0E3A1B"/>
           <rect class="pupil" x="147" y="16" width="11" height="10" fill="#66FF9E"/></g>
       </g>
       <g id="mouth" fill="#3CFF86">
         <g id="face-smile"><rect x="92" y="38" width="4" height="4"/><rect x="96" y="42" width="28" height="4"/><rect x="124" y="38" width="4" height="4"/></g>
         <g id="face-open"><rect x="98" y="36" width="24" height="3"/><rect x="96" y="39" width="28" height="2"/><rect x="96" y="41" width="28" height="2"/><rect x="98" y="43" width="24" height="3"/><rect x="100" y="39" width="20" height="4" fill="#0E3A1B"/></g>
         <g id="face-wide"><rect x="84" y="38" width="52" height="3"/><rect x="88" y="41" width="44" height="3"/><rect x="92" y="44" width="36" height="2"/></g>
         <g id="face-flat"><rect x="96" y="40" width="28" height="4"/></g>
         <g id="face-o"><rect x="100" y="36" width="20" height="10" fill="#0E3A1B"/><rect x="98" y="38" width="2" height="6"/><rect x="120" y="38" width="2" height="6"/></g>
         <g id="face-tongue"><rect x="92" y="38" width="4" height="4"/><rect x="96" y="42" width="28" height="4"/><rect x="124" y="38" width="4" height="4"/><rect x="104" y="45" width="10" height="5" fill="#FF6B8A"/></g>
       </g>
     </svg>
   </div>
   <div id="bubble" class="log"><span id="bubble-text"></span></div>
   <div id="panel" class="entry">
     <span>&gt;</span>
     <input id="q" placeholder="спросить…" autocomplete="off">
     <button id="send">→</button>
     <button id="collapse" title="Свернуть">⤡</button>
   </div>
  </div>
  <div class="keys">
   <button id="power" title="Выход">⏻</button>
   <button id="mbtn" title="Меню">≡</button>
   <button id="sleepbtn" title="Сон">☾</button>
   <button id="sound" title="Звук">🔊</button>
   <button id="widebtn" title="Развернуть">⤢</button>
   <button id="tx" title="Выйти из игры">✕</button>
  </div>
 </div>
 <div id="menu" role="menu"></div>
 <div id="floppy-mini" title="Открыть">⛁</div>
 <div id="robot" hidden></div>
 <div id="chips" hidden></div>
 <div id="login" hidden></div>
 <canvas id="tw" width="190" height="132"></canvas>
 

<script src="js/config.js"></script>
<script src="js/talk.js"></script>
<script src="js/audio.js"></script>
<script src="js/faces.js"></script>
<script src="js/stats.js"></script>
<script src="js/tetris.js"></script>
<script src="js/games.js"></script>
<script src="js/alice.js"></script>
<script src="js/menu.js"></script>
<script src="app.js"></script>
</body></html>
