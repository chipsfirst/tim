<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Т.И.М.</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/tetris.css">
</head>
<body>

<div id="bubble"><span id="bubble-text"></span></div>

<div id="chips">
  <button data-q="weather">Погода</button>
  <button data-q="time">Время</button>
  <button data-q="joke">Шутка</button>
  <button data-q="game">Играть</button>
</div>

<div id="panel">
  <input id="q" type="text" placeholder="Спроси Алису…" autocomplete="off" spellcheck="false">
  <button id="send" aria-label="Спросить">→</button>
  <button id="login" aria-label="Открыть окно Алисы" title="Войти в Алису">⌗</button>
</div>

<div id="robot">
  <svg viewBox="0 0 220 252" width="250" height="286">
    <defs>
      <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
        <rect width="4" height="2" fill="#000000" opacity="0.3"/>
      </pattern>
      <radialGradient id="glass" cx="42%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#2E5C3C" stop-opacity="0.45"/>
        <stop offset="55%" stop-color="#102415" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
      </radialGradient>
      <linearGradient id="case" x1="0.1" y1="0" x2="0.75" y2="1">
        <stop offset="0%" stop-color="#F0EADB"/>
        <stop offset="42%" stop-color="#DCD4C0"/>
        <stop offset="100%" stop-color="#B0A691"/>
      </linearGradient>
      <linearGradient id="caseTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="bezel" x1="0" y1="0" x2="0.6" y2="1">
        <stop offset="0%" stop-color="#4A4438"/>
        <stop offset="48%" stop-color="#332F27"/>
        <stop offset="100%" stop-color="#221F19"/>
      </linearGradient>
      <linearGradient id="btnFace" x1="0.2" y1="0" x2="0.8" y2="1">
        <stop offset="0%" stop-color="#E8E1D0"/>
        <stop offset="55%" stop-color="#CFC7B4"/>
        <stop offset="100%" stop-color="#A99F8A"/>
      </linearGradient>
      <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#9C9382"/>
        <stop offset="35%" stop-color="#D6CEBB"/>
        <stop offset="100%" stop-color="#8F8674"/>
      </linearGradient>
    </defs>

    <ellipse cx="110" cy="246" rx="44" ry="4" fill="#000" opacity="0.15"/>

    <!-- подставка -->
    <rect x="104" y="222" width="12" height="16" fill="url(#post)" stroke="#6E675A" stroke-width="2"/>
    <rect x="86" y="238" width="48" height="7" rx="3.5" fill="#C9C2B1" stroke="#6E675A" stroke-width="2.5"/>

    <!-- корпус -->
    <rect x="16" y="90" width="188" height="132" rx="11" fill="url(#case)" stroke="#6E675A" stroke-width="3"/>
    <rect x="19" y="93" width="182" height="126" rx="9" fill="url(#caseTop)" opacity="0.9"/>
    <rect x="19" y="196" width="182" height="23" rx="9" fill="#8F8674" opacity="0.22"/>
    <path d="M22 92.5 h176" stroke="#FFFDF6" stroke-width="1.6" opacity="0.75" stroke-linecap="round"/>
    <circle cx="24.5" cy="98.5" r="1.5" fill="#8B8271" opacity="0.7"/>
    <circle cx="195.5" cy="98.5" r="1.5" fill="#8B8271" opacity="0.7"/>
    <circle cx="24.5" cy="213.5" r="1.5" fill="#8B8271" opacity="0.7"/>
    <circle cx="195.5" cy="213.5" r="1.5" fill="#8B8271" opacity="0.7"/>

    <!-- экран почти во всю ширину корпуса -->
    <rect x="29" y="94" width="150" height="108" rx="9" fill="url(#bezel)" stroke="#6E675A" stroke-width="1.4"/>
    <rect x="31.5" y="96.5" width="145" height="103" rx="7" fill="none" stroke="#000000" stroke-width="1.8" opacity="0.5"/>
    <rect id="screen" x="34" y="99" width="140" height="98" rx="6" fill="#071108"/>
    <rect x="34" y="99" width="140" height="98" rx="6" fill="url(#glass)"/>

    <g id="eyes" shape-rendering="crispEdges">
      <g class="eye" data-side="left">
        <rect x="60" y="112" width="28" height="22" fill="#0E3A1B"/>
        <rect class="pupil" x="68" y="118" width="10" height="10" fill="#66FF9E"/>
      </g>
      <g class="eye" data-side="right">
        <rect x="122" y="112" width="28" height="22" fill="#0E3A1B"/>
        <rect class="pupil" x="130" y="118" width="10" height="10" fill="#66FF9E"/>
      </g>
    </g>

    <g id="caret" shape-rendering="crispEdges">
      <rect x="100" y="146" width="8" height="12" fill="#66FF9E"/>
    </g>

    <g id="mouth" shape-rendering="crispEdges" fill="#3CFF86">
      <g id="face-smile">
        <rect x="88" y="146" width="4" height="4"/>
        <rect x="92" y="150" width="28" height="4"/>
        <rect x="120" y="146" width="4" height="4"/>
      </g>
      <g id="face-open">
        <rect x="94" y="143" width="20" height="4"/>
        <rect x="92" y="147" width="24" height="4"/>
        <rect x="92" y="151" width="24" height="4"/>
        <rect x="94" y="155" width="20" height="3"/>
        <rect x="96" y="147" width="16" height="8" fill="#0E3A1B"/>
      </g>
      <g id="face-wide">
        <rect x="82" y="146" width="44" height="4"/>
        <rect x="86" y="150" width="36" height="4"/>
        <rect x="90" y="154" width="28" height="3"/>
        <rect x="88" y="148" width="6" height="3" fill="#DFFFEC"/>
        <rect x="100" y="148" width="6" height="3" fill="#DFFFEC"/>
        <rect x="112" y="148" width="6" height="3" fill="#DFFFEC"/>
      </g>
      <g id="face-flat">
        <rect x="92" y="150" width="24" height="4"/>
      </g>
      <g id="face-o">
        <rect x="98" y="145" width="12" height="10" fill="#0E3A1B"/>
        <rect x="96" y="147" width="2" height="6"/>
        <rect x="110" y="147" width="2" height="6"/>
        <rect x="98" y="143" width="12" height="2"/>
        <rect x="98" y="155" width="12" height="2"/>
      </g>
      <g id="face-tongue">
        <rect x="88" y="146" width="4" height="4"/>
        <rect x="92" y="150" width="28" height="4"/>
        <rect x="120" y="146" width="4" height="4"/>
        <rect x="98" y="154" width="10" height="6" fill="#FF6B8A"/>
      </g>
    </g>

    <rect id="scanrect" x="34" y="99" width="140" height="98" rx="6" fill="url(#scan)"/>

    <!-- кнопки справа от экрана -->
    <g id="power" class="btn">
      <circle cx="190" cy="112" r="7.5" fill="url(#btnFace)" stroke="#6E675A" stroke-width="1.7"/>
      <path d="M190 107.8 v4.2" stroke="#6E675A" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M187.2 109.2 a4.5 4.5 0 1 0 5.6 0" fill="none" stroke="#6E675A" stroke-width="1.3"/>
    </g>

    <g id="mbtn" class="btn">
      <circle cx="190" cy="142" r="7.5" fill="url(#btnFace)" stroke="#6E675A" stroke-width="1.7"/>
      <path d="M186.4 139.4 h7.2 M186.4 142 h7.2 M186.4 144.6 h7.2" stroke="#5B5445" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <g id="sleepbtn" class="btn">
      <circle cx="190" cy="172" r="7.5" fill="url(#btnFace)" stroke="#6E675A" stroke-width="1.7"/>
      <path d="M190 167.4 a5 5 0 1 0 5 6.6 5.8 5.8 0 0 1-5-6.6 z" fill="#6E675A"/>
    </g>

    <g id="sound" class="btn">
      <circle cx="190" cy="202" r="7.5" fill="url(#btnFace)" stroke="#6E675A" stroke-width="1.7"/>
      <path d="M186.2 200 h1.9 l2.3-1.9 v6.4 l-2.3-1.9 h-1.9 z" fill="#6E675A"/>
      <path d="M192.2 199.4 a3.6 3.6 0 0 1 0 4.6" fill="none" stroke="#6E675A" stroke-width="1"/>
      <line id="sound-off" x1="185.6" y1="205" x2="193.4" y2="199.2" stroke="#B4442E" stroke-width="1.7" stroke-linecap="round"/>
    </g>

    <!-- показатели внизу корпуса, с отступом от края -->
    <g id="stats" font-family="ui-monospace,Menlo,Consolas,monospace">
      <g id="g-batt">
        <title>Батарея</title>
        <path d="M44 205 h6.5 l-3.8 4.6 h4.6 l-7.4 8.4 1.9-5.6 h-3.7 z" fill="#E8A93C"/>
        <text id="n-batt" x="58" y="217" font-size="14" font-weight="700" fill="#4A4436">100</text>
      </g>
      <g id="g-hp">
        <title>Здоровье</title>
        <path d="M96 209 c0-3.8 4.7-4.4 6-1.7 1.3-2.7 6-2.1 6 1.7 0 3.2-6 6.9-6 6.9 s-6-3.7-6-6.9 z" fill="#C2503C"/>
        <text id="n-hp" x="110" y="217" font-size="14" font-weight="700" fill="#4A4436">100</text>
      </g>
      <g id="g-sleep">
        <title>Сон</title>
        <path d="M146 204 a6.6 6.6 0 1 0 7.2 8.4 7.8 7.8 0 0 1-7.2-8.4 z" fill="#3E86B8"/>
        <text id="n-sleep" x="160" y="217" font-size="14" font-weight="700" fill="#4A4436">100</text>
      </g>
    </g>

    <circle id="led" cx="190" cy="219" r="3" fill="#4BFF8D"/>
  </svg>
</div>

<canvas id="tw" width="140" height="280"></canvas>
<button id="tx" title="Выйти (Esc)">✕</button>
<div id="menu" role="menu"></div>

<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/faces.js"></script>
<script src="js/stats.js"></script>
<script src="js/tetris.js"></script>
<script src="js/menu.js"></script>
<script src="app.js"></script>
</body>
</html>
