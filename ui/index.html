<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Т.И.М.</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="bubble"><span id="bubble-text"></span></div>

<div id="chips">
  <button data-q="weather">Погода</button>
  <button data-q="time">Время</button>
  <button data-q="joke">Шутка</button>
  <button data-q="game">Играть</button>
</div>

<div id="panel">
  <input id="q" type="text" placeholder="Спроси Алису…" autocomplete="off" spellcheck="false">
  <button id="send" aria-label="Спросить">→</button>
  <button id="login" aria-label="Открыть окно Алисы" title="Войти в Алису">⌗</button>
</div>

<div id="robot">
  <svg viewBox="0 0 220 252" width="200" height="236">
    <defs>
      <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
        <rect width="4" height="2" fill="#000000" opacity="0.3"/>
      </pattern>
      <radialGradient id="glass" cx="50%" cy="38%" r="76%">
        <stop offset="0%" stop-color="#20432A" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <ellipse cx="110" cy="246" rx="38" ry="4" fill="#000" opacity="0.15"/>

    <!-- минимальная подставка -->
    <rect x="104" y="222" width="12" height="16" fill="#B9B09C" stroke="#6E675A" stroke-width="2"/>
    <rect x="88" y="238" width="44" height="7" rx="3.5" fill="#C9C2B1" stroke="#6E675A" stroke-width="2.5"/>

    <!-- монитор-голова -->
    <rect x="38" y="100" width="144" height="122" rx="10" fill="#CFC8B7" stroke="#6E675A" stroke-width="3"/>
    <rect x="50" y="110" width="120" height="78" rx="5" fill="#071108"/>
    <rect x="50" y="110" width="120" height="78" rx="5" fill="url(#glass)"/>

    <g id="eyes" shape-rendering="crispEdges">
      <g class="eye" data-side="left">
        <rect x="66" y="124" width="28" height="22" fill="#0E3A1B"/>
        <rect class="pupil" x="74" y="130" width="10" height="10" fill="#66FF9E"/>
      </g>
      <g class="eye" data-side="right">
        <rect x="126" y="124" width="28" height="22" fill="#0E3A1B"/>
        <rect class="pupil" x="134" y="130" width="10" height="10" fill="#66FF9E"/>
      </g>
    </g>

    <g id="mouth" shape-rendering="crispEdges" fill="#3CFF86">
      <rect x="92" y="152" width="4" height="4"/>
      <rect x="96" y="156" width="28" height="4"/>
      <rect x="124" y="152" width="4" height="4"/>
    </g>

    <rect x="50" y="110" width="120" height="78" rx="5" fill="url(#scan)"/>

    <!-- нижняя панель -->
    <g id="power" class="btn">
      <circle cx="56" cy="204" r="7" fill="#C9C2B1" stroke="#6E675A" stroke-width="1.6"/>
      <path d="M56 200 v4" stroke="#6E675A" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M53.4 201.2 a4.2 4.2 0 1 0 5.2 0" fill="none" stroke="#6E675A" stroke-width="1.5"/>
    </g>

    <g id="sound" class="btn">
      <circle cx="78" cy="204" r="7" fill="#C9C2B1" stroke="#6E675A" stroke-width="1.6"/>
      <path d="M74.2 202.4 h1.9 l2.4-2 v7 l-2.4-2 h-1.9 z" fill="#6E675A"/>
      <path d="M80.6 201.6 a4 4 0 0 1 0 4.8" fill="none" stroke="#6E675A" stroke-width="1.2"/>
      <line id="sound-off" x1="73.5" y1="206.5" x2="81.5" y2="201.5" stroke="#B4442E" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <rect id="floppy" x="126" y="196" width="26" height="9" rx="1.5" fill="#B4AC9A" stroke="#8A8272" stroke-width="1.5"/>
    <line x1="129" y1="200.5" x2="149" y2="200.5" stroke="#8A8272" stroke-width="1.2"/>
    <circle cx="164" cy="204" r="2.8" fill="#A79F8C" stroke="#6E675A" stroke-width="1.2"/>
    <circle id="led" cx="174" cy="204" r="3" fill="#4BFF8D"/>
  </svg>
</div>

<script src="app.js"></script>
</body>
</html>
