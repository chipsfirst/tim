<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Т.И.М.</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="bubble"><span id="bubble-text"></span></div>

<div id="chips">
  <button data-q="weather">Погода</button>
  <button data-q="time">Время</button>
  <button data-q="joke">Шутка</button>
  <button data-q="game">Играть</button>
</div>

<div id="panel">
  <input id="q" type="text" placeholder="Спроси Алису…" autocomplete="off" spellcheck="false">
  <button id="send" aria-label="Спросить">→</button>
  <button id="collapse" title="Свернуть">▁</button>
  <button id="login" aria-label="Открыть окно Алисы" title="Войти в Алису">⌗</button>
</div>

<div id="robot">
  <svg viewBox="0 0 220 252" width="250" height="286">
    <defs>
      <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
        <rect width="4" height="2" fill="#000000" opacity="0.3"/>
      </pattern>
      <radialGradient id="glass" cx="42%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#2E5C3C" stop-opacity="0.45"/>
        <stop offset="55%" stop-color="#102415" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
      </radialGradient>
      <linearGradient id="case" x1="0.1" y1="0" x2="0.75" y2="1">
        <stop offset="0%" stop-color="#F0EADB"/>
        <stop offset="42%" stop-color="#DCD4C0"/>
        <stop offset="100%" stop-color="#B0A691"/>
      </linearGradient>
      <linearGradient id="caseTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="bezel" x1="0" y1="0" x2="0.6" y2="1">
        <stop offset="0%" stop-color="#4A4438"/>
        <stop offset="48%" stop-color="#332F27"/>
        <stop offset="100%" stop-color="#221F19"/>
      </linearGradient>
      <linearGradient id="btnFace" x1="0.2" y1="0" x2="0.8" y2="1">
        <stop offset="0%" stop-color="#E8E1D0"/>
        <stop offset="55%" stop-color="#CFC7B4"/>
        <stop offset="100%" stop-color="#A99F8A"/>
      </linearGradient>
      <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#9C9382"/>
        <stop offset="35%" stop-color="#D6CEBB"/>
        <stop offset="100%" stop-color="#8F8674"/>
      </linearGradient>
    </defs>

    <ellipse cx="110" cy="246" rx="44" ry="4" fill="#000" opacity="0.15"/>

    <!-- корпус -->
    <rect x="16" y="90" width="188" height="132" rx="11" fill="url(#case)" stroke="#6E675A" stroke-width="3"/>
    <rect x="19" y="93" width="182" height="126" rx="9" fill="url(#caseTop)" opacity="0.9"/>
    <rect x="19" y="196" width="182" height="23" rx="9" fill="#8F8674" opacity="0.22"/>
    <path d="M22 92.5 h176" stroke="#FFFDF6" stroke-width="1.6" opacity="0.75" stroke-linecap="round"/>
    <circle cx="24.5" cy="98.5" r="1.5" fill="#8B8271" opacity="0.7"/>
    <circle cx="195.5" cy="98.5" r="1.5" fill="#8B8271" opacity="0.7"/>
    <circle cx="24.5" cy="213.5" r="1.5" fill="#8B8271" opacity="0.7"/>
    <circle cx="195.5" cy="213.5" r="1.5" fill="#8B8271" opacity="0.7"/>

    <!-- экран почти во всю ширину корпуса -->
    <rect x="22" y="93" width="176" height="124" rx="9" fill="url(#bezel)" stroke="#6E675A" stroke-width="1.4"/>
    <rect x="24.5" y="95.5" width="171" height="119" rx="7" fill="none" stroke="#000000" stroke-width="1.8" opacity="0.5"/>
    <rect id="screen" x="25" y="96" width="170" height="118" rx="6" fill="#071108"/>
    <rect x="25" y="96" width="170" height="118" rx="6" fill="url(#glass)"/>

    <g id="eyes" shape-rendering="crispEdges">
      <g class="eye" data-side="left">
        <rect x="60" y="134" width="28" height="22" fill="#0E3A1B"/>
        <rect class="pupil" x="68" y="140" width="10" height="10" fill="#66FF9E"/>
      </g>
      <g class="eye" data-side="right">
        <rect x="122" y="134" width="28" height="22" fill="#0E3A1B"/>
        <rect class="pupil" x="130" y="140" width="10" height="10" fill="#66FF9E"/>
      </g>
    </g>

    <g id="caret" shape-rendering="crispEdges">
      <rect x="100" y="170" width="8" height="12" fill="#66FF9E"/>
    </g>

    <g id="mouth" shape-rendering="crispEdges" fill="#3CFF86">
      <g id="face-smile">
        <rect x="88" y="170" width="4" height="4"/>
        <rect x="92" y="174" width="28" height="4"/>
        <rect x="120" y="170" width="4" height="4"/>
      </g>
      <g id="face-open">
        <rect x="94" y="143" width="20" height="4"/>
        <rect x="92" y="147" width="24" height="4"/>
        <rect x="92" y="151" width="24" height="4"/>
        <rect x="94" y="155" width="20" height="3"/>
        <rect x="96" y="147" width="16" height="8" fill="#0E3A1B"/>
      </g>
      <g id="face-wide">
        <rect x="82" y="146" width="44" height="4"/>
        <rect x="86" y="150" width="36" height="4"/>
        <rect x="90" y="154" width="28" height="3"/>
        <rect x="88" y="148" width="6" height="3" fill="#DFFFEC"/>
        <rect x="100" y="148" width="6" height="3" fill="#DFFFEC"/>
        <rect x="112" y="148" width="6" height="3" fill="#DFFFEC"/>
      </g>
      <g id="face-flat">
        <rect x="92" y="150" width="24" height="4"/>
      </g>
      <g id="face-o">
        <rect x="98" y="145" width="12" height="10" fill="#0E3A1B"/>
        <rect x="96" y="147" width="2" height="6"/>
        <rect x="110" y="147" width="2" height="6"/>
        <rect x="98" y="143" width="12" height="2"/>
        <rect x="98" y="155" width="12" height="2"/>
      </g>
      <g id="face-tongue">
        <rect x="88" y="170" width="4" height="4"/>
        <rect x="92" y="174" width="28" height="4"/>
        <rect x="120" y="170" width="4" height="4"/>
        <rect x="98" y="154" width="10" height="6" fill="#FF6B8A"/>
      </g>
    </g>

    <rect id="scanrect" x="25" y="96" width="170" height="118" rx="6" fill="url(#scan)"/>

    <!-- кнопки справа от экрана -->

    <!-- показатели внизу корпуса, с отступом от края -->
    <g id="stats" font-family="ui-monospace,Menlo,Consolas,monospace">
      <g id="g-batt">
        <title>Батарея</title>
        <path d="M34 199 h5 l-3 3.6 h3.6 l-5.6 6.4 1.4-4.2 h-2.8 z" fill="#E8A93C"/>
        
      </g>
      <g id="g-hp">
        <title>Здоровье</title>
        <path d="M92 202 c0-3 3.6-3.4 4.6-1.3 1-2.1 4.6-1.7 4.6 1.3 0 2.4-4.6 5.2-4.6 5.2 s-4.6-2.8-4.6-5.2 z" fill="#C2503C"/>
        
      </g>
      <g id="g-sleep">
        <title>Сон</title>
        <path d="M150 198 a4.6 4.6 0 1 0 5.2 6 5.6 5.6 0 0 1-5.2-6 z" fill="#3E86B8"/>
        
      </g>
    </g>

    <!-- клавиши на передней панели -->
    <rect x="41" y="224" width="138" height="20" rx="4" fill="url(#case)" stroke="#6E675A" stroke-width="1.4"/>
    <rect x="41" y="238" width="138" height="6" rx="3" fill="#8F8674" opacity="0.35"/>
    <g id="power" class="btn"><rect x="45" y="227" width="22" height="14" rx="3" fill="url(#btnFace)" stroke="#6E675A" stroke-width="1.2"/>
      <path d="M56 230.5 v3" stroke="#4E4838" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M53.8 231.6 a3.2 3.2 0 1 0 4.4 0" fill="none" stroke="#4E4838" stroke-width="1.2"/></g>
    <g id="mbtn" class="btn"><rect x="71" y="227" width="22" height="14" rx="3" fill="url(#btnFace)" stroke="#6E675A" stroke-width="1.2"/>
      <path d="M77 231 h10 M77 234 h10 M77 237 h10" stroke="#4E4838" stroke-width="1.3" stroke-linecap="round"/></g>
    <g id="sleepbtn" class="btn"><rect x="97" y="227" width="22" height="14" rx="3" fill="url(#btnFace)" stroke="#6E675A" stroke-width="1.2"/>
      <path d="M110.6 230.2 a4 4 0 1 0 0 7.6 3.2 3.2 0 0 1 0-7.6 z" fill="#4E4838"/></g>
    <g id="sound" class="btn"><rect x="123" y="227" width="22" height="14" rx="3" fill="url(#btnFace)" stroke="#6E675A" stroke-width="1.2"/>
      <path d="M133 232 h2 l2.4-2 v8 l-2.4-2 h-2 z" fill="#4E4838"/>
      <path d="M139 231.4 a3.6 3.6 0 0 1 0 5.2" fill="none" stroke="#4E4838" stroke-width="1.1"/><line id="sound-off" x1="131" y1="238" x2="143" y2="230" stroke="#B4442E" stroke-width="1.8" stroke-linecap="round"/></g>
    <text id="n-batt" x="58" y="207" font-size="11" fill="#FFFFFF">100</text><text id="n-hp" x="114" y="207" font-size="11" fill="#FFFFFF">100</text><text id="n-sleep" x="170" y="207" font-size="11" fill="#FFFFFF">100</text>
    <g id="widebtn" class="btn"><rect x="149" y="227" width="22" height="14" rx="3" fill="url(#btnFace)" stroke="#6E675A" stroke-width="1.2"/>
      <text x="160" y="237.5" font-size="10" text-anchor="middle" fill="#4E4838" font-family="ui-monospace,Menlo,monospace">&#10530;</text></g>
    <circle id="led" cx="188" cy="218" r="3" fill="#4BFF8D"/>
  </svg>
</div>

<canvas id="tw" width="190" height="132"></canvas>
<button id="tx" title="Выйти (Esc)">✕</button>
<div id="menu" role="menu"></div>

<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/talk.js"></script>
<script src="js/faces.js"></script>
<script src="js/stats.js"></script>
<script src="js/tetris.js"></script>
<script src="js/games.js"></script>
<script src="js/alice.js"></script>
<script src="js/menu.js"></script>
<script src="app.js"></script>
</body>
</html>
