<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Вариант 2 — минимализм</title>
<style>
 html,body{margin:0;height:300px;background:#CFC8B7;font-family:ui-monospace,Menlo,monospace}
 .w{width:260px;height:300px;margin:0 auto;background:linear-gradient(160deg,#F0EADB,#B0A691);
    border:3px solid #6E675A;border-radius:14px;box-shadow:0 8px 20px rgba(30,20,10,.25);overflow:hidden;
    display:flex;flex-direction:column}
 .scr{flex:1;margin:8px;border-radius:6px;background:#071108;position:relative;overflow:hidden;
      box-shadow:inset 0 0 18px rgba(60,255,134,.18);display:flex;flex-direction:column}
 .st{font-size:10px;color:#fff;padding:3px 6px;border-bottom:1px solid #143b22}
 .log{flex:1;overflow:auto;font-size:10.5px;line-height:1.28;color:#9BFFC4;padding:4px 6px}
 .log div{margin-bottom:3px}
 .inp{display:flex;gap:3px;padding:4px}
 .inp input{flex:1;height:20px;font-size:10px;background:#0E2415;border:1px solid #2A5A3A;
   border-radius:3px;color:#CFFFE2;padding:0 4px;outline:none}
 .keys{display:flex;gap:5px;justify-content:center;padding:0 8px 8px}
 .keys span{width:34px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center;
   background:#E8E1D0;border:1px solid #6E675A;border-radius:3px;color:#4E4838}
</style></head><body><div class="w">
 <div class="scr">
  <div class="st">⚡100 ♥100 ☾100</div>
  <div class="log"><div>— Погода?</div><div>+3°, облачно, ветер 4 м/с.</div><div>— Спасибо!</div><div>Я тут, если что.</div></div>
  <div class="inp"><input placeholder="Спроси…"><button>→</button></div>
 </div>
 <div class="keys"><span>⏻</span><span>≡</span><span>☾</span><span>🔊</span><span>⤢</span></div>
</div></body></html>
