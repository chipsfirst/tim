<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Вариант 3 — терминал</title>
<style>
 html,body{margin:0;height:330px;background:#CFC8B7;font-family:ui-monospace,Menlo,monospace}
 .w{width:280px;height:330px;margin:0 auto;display:flex;gap:6px;padding:8px;box-sizing:border-box}
 .mon{flex:1;background:linear-gradient(160deg,#F0EADB,#B0A691);border:3px solid #6E675A;
   border-radius:10px;padding:6px;box-shadow:0 8px 18px rgba(30,20,10,.25);display:flex}
 .scr{flex:1;background:#071108;border-radius:5px;display:flex;flex-direction:column;overflow:hidden;
   box-shadow:inset 0 0 18px rgba(60,255,134,.18)}
 .t{font-size:9.5px;color:#5FBE86;padding:3px 5px;border-bottom:1px solid #143b22;letter-spacing:.04em}
 .log{flex:1;overflow:auto;font-size:10px;line-height:1.35;color:#9BFFC4;padding:4px 5px}
 .log i{color:#CFFFE2;font-style:normal}
 .log b{color:#66FF9E;font-weight:400}
 .inp{display:flex;border-top:1px solid #143b22}
 .inp span{color:#66FF9E;padding:4px 5px;font-size:11px}
 .inp input{flex:1;background:transparent;border:0;outline:none;color:#CFFFE2;font:10px ui-monospace,monospace;padding:4px 2px}
 .col{display:flex;flex-direction:column;gap:6px;justify-content:center}
 .col span{width:24px;height:24px;font-size:11px;display:flex;align-items:center;justify-content:center;
   background:#E8E1D0;border:1.2px solid #6E675A;border-radius:4px;color:#4E4838}
</style></head><body><div class="w">
 <div class="mon"><div class="scr">
   <div class="t">Т.И.М. · ур.3 · ⚡100 ♥100 ☾100</div>
   <div class="log">
     <div><b>&gt; погода</b></div><div><i>+3°, облачно, ветер 4 м/с</i></div>
     <div><b>&gt; спасибо</b></div><div><i>всегда пожалуйста</i></div>
   </div>
   <div class="inp"><span>&gt;</span><input placeholder="вопрос…"></div>
 </div></div>
 <div class="col"><span>⏻</span><span>≡</span><span>☾</span><span>🔊</span></div>
</div></body></html>
